name: Release

# 触发条件：推送形如 vX.X.X 的标签时编译并发布 exe；也可在 Actions 页面手动触发（用于验证流程）
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write # 创建 Release / 上传资产需要写权限

jobs:
  build-windows:
    name: Build Windows exe & Release
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0" # 纯 Go 实现（syscall 绑定 wpcap.dll），无需 cgo/mingw

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go（按 go.mod 指定版本）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 校验标签并计算产物名
        id: vars
        shell: pwsh
        run: |
          $isTag = "${{ github.ref_type }}" -eq "tag"
          $tag   = if ($isTag) { "${{ github.ref_name }}" } else { "v0.0.0-dev" }
          if ($isTag -and $tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "标签格式必须为 vX.X.X（例如 v0.0.1），当前为：$tag"
          }
          if ($isTag) {
            "asset=Golang104Parser-$tag.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "asset=Golang104Parser-dev.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          "tag=$tag"                     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "skip_release=$(!$isTag)"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "触发方式：$(if ($isTag) { '标签' } else { '手动' })  产物：$(Get-Content $env:GITHUB_OUTPUT | Select-String '^asset=')"

      - name: 下载依赖
        run: go mod download

      - name: 单元测试（协议解析 / 点表 / 导出导入闭环）
        run: go test ./internal/... -count=1

      - name: 生成图标资源（失败则使用仓库内已有的 rsrc.syso）
        continue-on-error: true
        run: |
          go run ./scripts/mkico -in logo.png -out build/windows/icon.ico
          go run github.com/akavel/rsrc@latest -ico build/windows/icon.ico -o rsrc.syso -arch amd64

      - name: 编译单文件 exe（Wails 需 -tags desktop,production；前端资源内嵌）
        run: |
          go build -trimpath -tags desktop,production `
            -ldflags "-s -w -H windowsgui" `
            -o "${{ steps.vars.outputs.asset }}" .

      - name: 产物信息
        shell: pwsh
        run: |
          $f = Get-Item "${{ steps.vars.outputs.asset }}"
          Write-Host ("产物：{0}  {1:N2} MB" -f $f.Name, ($f.Length / 1MB))
          Get-FileHash $f.FullName -Algorithm SHA256 | Format-List

      - name: 发布 Release 并上传 exe
        if: steps.vars.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          files: ${{ steps.vars.outputs.asset }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## IEC 101/104 实时报文解析工具 ${{ steps.vars.outputs.tag }}

            单文件 Windows 桌面程序（Wails v2 + Vue3 静态前端，纯 Go 无 cgo），双击即可运行。

            ### 下载
            - `${{ steps.vars.outputs.asset }}`（本 Release 资产，单文件免安装）

            ### 运行要求
            - Windows 10/11 x64，需已安装 **WebView2 Runtime**（系统一般自带；缺失时程序会弹窗提示）
            - **网口旁听**需安装 **Npcap**（建议 1.16+，安装时勾选 *WinPcap API-compatible Mode*）并以**管理员身份**运行
            - 串口（101）/ 静态解析 / 文件解析 / 导入导出无需管理员权限

            ### 主要功能
            网口旁听（104，不占用端口）· 串口旁听（101，485 总线/232 直测）· 多线程实时解析（顺序保持）·
            点表点名（工程库 dbSelect，转发点表基址可配）· 定值表（国网/南网）· 搜索与筛选 · 导入导出（md/text/log）·
            文件服务内容解析 · 地址显示进制可配 · 深浅主题
